name: CI and ECR publish

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main
    paths:
      - ".github/workflows/ci-ecr.yml"
      - ".dockerignore"
      - "Dockerfile"
      - "requirements.txt"
      - "delivery_delay/**"
      - "frontend/**"
      - "manifests/model/delay-risk/v2/release-001.json"

  workflow_dispatch:
    inputs:
      publish_image:
        description: "Publish the current main-branch commit to ECR"
        required: true
        default: false
        type: boolean

permissions: {}

concurrency:
  group: ci-ecr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13.15"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Verify Python version
        shell: bash
        run: |
          set -euo pipefail
          python --version
          python -c "import sys; assert sys.version_info[:3] == (3, 13, 15), sys.version"

      - name: Install Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt

      - name: Run Python tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q -p no:cacheprovider

  frontend-tests:
    name: Frontend tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24.20.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify Node version
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          node -e "if (process.version !== 'v24.20.0') throw new Error('Unexpected Node version: ' + process.version)"

      - name: Install frontend dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci

      - name: Run frontend tests
        shell: bash
        run: |
          set -euo pipefail
          npm test -- --run

      - name: Build frontend
        shell: bash
        run: |
          set -euo pipefail
          npm run build

  publish-ecr:
    name: Verify artifacts and publish ECR image
    needs:
      - python-tests
      - frontend-tests
    if: >-
      github.ref == 'refs/heads/main' &&
      (
        github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && inputs.publish_image)
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write

    env:
      AWS_ACCOUNT_ID: "556071985875"
      AWS_ROLE_ARN: arn:aws:iam::556071985875:role/delivery-delay-github-actions-build-role
      ECR_REPOSITORY: delivery-delay-app
      ECR_REGISTRY: 556071985875.dkr.ecr.ap-southeast-1.amazonaws.com
      MODEL_MANIFEST: manifests/model/delay-risk/v2/release-001.json

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python for metadata validation
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13.15"

      - name: Validate model release manifest
        id: manifest
        shell: bash
        env:
          MANIFEST_PATH: ${{ env.MODEL_MANIFEST }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import binascii
          import json
          import os
          import re
          from pathlib import Path

          EXPECTED_BUCKET = (
              "delivery-delay-model-artifacts-"
              "ap-southeast-1-20260908-7f3c9a2d"
          )
          EXPECTED_REGION = "ap-southeast-1"
          EXPECTED_RELEASE_ID = "release-001"
          EXPECTED_PREFIX = "models/delay-risk/v2/release-001/"
          EXPECTED_FILENAMES = (
              "delay_model_v2_pipeline.joblib",
              "delay_model_v2_metrics.json",
          )
          LABELS = {
              "delay_model_v2_pipeline.joblib": "pipeline",
              "delay_model_v2_metrics.json": "metrics",
          }
          EXPECTED_CONTENT_TYPES = {
              "delay_model_v2_pipeline.joblib": "application/octet-stream",
              "delay_model_v2_metrics.json": "application/json",
          }

          def require(condition, message):
              if not condition:
                  raise SystemExit(f"Manifest validation failed: {message}")

          def reject_duplicate_keys(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError(f"duplicate JSON key: {key}")
                  result[key] = value
              return result

          manifest_path = Path(os.environ["MANIFEST_PATH"])
          require(manifest_path.is_file(), "manifest file is missing")
          require(not manifest_path.is_symlink(), "manifest must not be a symlink")

          try:
              with manifest_path.open("r", encoding="utf-8") as handle:
                  manifest = json.load(
                      handle,
                      object_pairs_hook=reject_duplicate_keys,
                  )
          except (OSError, UnicodeError, json.JSONDecodeError, ValueError) as exc:
              raise SystemExit(f"Manifest validation failed: {exc}") from exc

          require(isinstance(manifest, dict), "root must be an object")
          require(manifest.get("bucket") == EXPECTED_BUCKET, "unexpected bucket")
          require(manifest.get("region") == EXPECTED_REGION, "unexpected region")
          require(
              manifest.get("release_id") == EXPECTED_RELEASE_ID,
              "unexpected release ID",
          )
          require(manifest.get("prefix") == EXPECTED_PREFIX, "unexpected prefix")

          artifacts = manifest.get("runtime_artifacts")
          require(
              isinstance(artifacts, list) and len(artifacts) == 2,
              "runtime_artifacts must contain exactly two entries",
          )

          by_filename = {}
          seen_keys = set()

          for index, artifact in enumerate(artifacts):
              require(
                  isinstance(artifact, dict),
                  f"runtime_artifacts[{index}] must be an object",
              )

              filename = artifact.get("filename")
              require(
                  filename in EXPECTED_FILENAMES,
                  f"unexpected runtime filename at index {index}",
              )
              require(
                  filename not in by_filename,
                  f"duplicate filename: {filename}",
              )

              key = artifact.get("s3_key")
              require(
                  isinstance(key, str) and key == EXPECTED_PREFIX + filename,
                  f"invalid S3 key for {filename}",
              )
              require(key not in seen_keys, f"duplicate S3 key: {key}")

              size = artifact.get("size_bytes")
              require(
                  type(size) is int and size > 0,
                  f"size_bytes must be a positive integer for {filename}",
              )

              sha256_hex = artifact.get("sha256_hex")
              require(
                  isinstance(sha256_hex, str)
                  and re.fullmatch(r"[0-9a-f]{64}", sha256_hex) is not None,
                  f"invalid lowercase SHA-256 hex for {filename}",
              )

              sha256_base64 = artifact.get("sha256_base64")
              require(
                  isinstance(sha256_base64, str)
                  and re.fullmatch(
                      r"[A-Za-z0-9+/]{43}=",
                      sha256_base64,
                  ) is not None,
                  f"invalid SHA-256 base64 shape for {filename}",
              )

              try:
                  decoded_digest = base64.b64decode(
                      sha256_base64,
                      validate=True,
                  )
              except (binascii.Error, ValueError) as exc:
                  raise SystemExit(
                      f"Manifest validation failed: invalid base64 for {filename}"
                  ) from exc

              require(
                  len(decoded_digest) == 32,
                  f"base64 digest is not 32 bytes for {filename}",
              )
              require(
                  decoded_digest == bytes.fromhex(sha256_hex),
                  f"hex and base64 digests differ for {filename}",
              )
              require(
                  base64.b64encode(decoded_digest).decode("ascii")
                  == sha256_base64,
                  f"base64 digest is not canonical for {filename}",
              )

              version_id = artifact.get("version_id")
              require(
                  isinstance(version_id, str)
                  and re.fullmatch(
                      r"[A-Za-z0-9._-]{1,1024}",
                      version_id,
                  ) is not None,
                  f"invalid or empty version ID for {filename}",
              )
              require(
                  artifact.get("encryption") == "AES256",
                  f"unexpected encryption for {filename}",
              )
              require(
                  artifact.get("content_type")
                  == EXPECTED_CONTENT_TYPES[filename],
                  f"unexpected content type for {filename}",
              )

              by_filename[filename] = artifact
              seen_keys.add(key)

          require(
              set(by_filename) == set(EXPECTED_FILENAMES),
              "runtime filename set is incomplete",
          )

          output_values = {
              "bucket": EXPECTED_BUCKET,
              "region": EXPECTED_REGION,
              "release_id": EXPECTED_RELEASE_ID,
              "prefix": EXPECTED_PREFIX,
          }

          for filename in EXPECTED_FILENAMES:
              label = LABELS[filename]
              artifact = by_filename[filename]
              output_values.update(
                  {
                      f"{label}_filename": artifact["filename"],
                      f"{label}_key": artifact["s3_key"],
                      f"{label}_size": artifact["size_bytes"],
                      f"{label}_sha256_hex": artifact["sha256_hex"],
                      f"{label}_sha256_base64": artifact["sha256_base64"],
                      f"{label}_version_id": artifact["version_id"],
                  }
              )

          github_output = os.environ.get("GITHUB_OUTPUT")
          require(github_output, "GITHUB_OUTPUT is unavailable")

          with open(github_output, "a", encoding="utf-8", newline="\n") as handle:
              for name, value in output_values.items():
                  require(
                      re.fullmatch(r"[a-z][a-z0-9_]*", name) is not None,
                      f"unsafe output name: {name!r}",
                  )
                  text = str(value)
                  require(text, f"empty output value for {name}")
                  require(
                      len(text) <= 2048,
                      f"output value is too long for {name}",
                  )
                  require(
                      "\n" not in text
                      and "\r" not in text
                      and "\x00" not in text,
                      f"multiline or NUL output rejected for {name}",
                  )
                  require(
                      re.fullmatch(r"[\x21-\x7e]+", text) is not None,
                      f"non-printable or whitespace output rejected for {name}",
                  )
                  handle.write(f"{name}={text}\n")

          print("Validated exactly two version-pinned runtime artifacts.")
          PY

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ap-southeast-1
          role-duration-seconds: 1800
          role-session-name: delivery-delay-${{ github.run_id }}
          allowed-account-ids: "556071985875"
          mask-aws-account-id: true
          unset-current-credentials: true

      - name: Check immutable ECR tag
        id: ecr_tag
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys

          sha = os.environ["GITHUB_SHA"]
          if re.fullmatch(r"[0-9a-f]{40}", sha) is None:
              raise SystemExit(f"Invalid GITHUB_SHA: {sha!r}")

          tag = f"sha-{sha}"
          command = [
              "aws",
              "ecr",
              "describe-images",
              "--registry-id",
              "556071985875",
              "--repository-name",
              "delivery-delay-app",
              "--image-ids",
              f"imageTag={tag}",
              "--region",
              "ap-southeast-1",
              "--no-cli-pager",
              "--output",
              "json",
          ]

          result = subprocess.run(
              command,
              check=False,
              capture_output=True,
              text=True,
          )

          outputs = {"tag": tag}

          if result.returncode == 0:
              try:
                  response = json.loads(result.stdout)
              except json.JSONDecodeError as exc:
                  raise SystemExit(
                      "ECR describe-images returned invalid JSON"
                  ) from exc

              details = response.get("imageDetails")
              if not isinstance(details, list) or len(details) != 1:
                  raise SystemExit(
                      "ECR describe-images did not return exactly one image"
                  )

              detail = details[0]
              digest = detail.get("imageDigest")
              tags = detail.get("imageTags")

              if (
                  not isinstance(digest, str)
                  or re.fullmatch(r"sha256:[0-9a-f]{64}", digest) is None
              ):
                  raise SystemExit("ECR returned a malformed image digest")
              if not isinstance(tags, list) or tag not in tags:
                  raise SystemExit("ECR response does not contain the requested tag")

              outputs["exists"] = "true"
              outputs["digest"] = digest
              print(f"ECR tag already exists at digest {digest}; push will be skipped.")

          elif "ImageNotFoundException" in result.stderr:
              outputs["exists"] = "false"
              print("ECR tag does not exist; one build and push are permitted.")

          else:
              sys.stderr.write(result.stderr)
              raise SystemExit(
                  f"ECR describe-images failed with exit code {result.returncode}"
              )

          github_output = os.environ.get("GITHUB_OUTPUT")
          if not github_output:
              raise SystemExit("GITHUB_OUTPUT is unavailable")

          with open(github_output, "a", encoding="utf-8", newline="\n") as handle:
              for name, value in outputs.items():
                  if re.fullmatch(r"[a-z][a-z0-9_]*", name) is None:
                      raise SystemExit(f"Unsafe output name: {name!r}")
                  if (
                      not value
                      or "\n" in value
                      or "\r" in value
                      or "\x00" in value
                      or re.fullmatch(r"[\x21-\x7e]+", value) is None
                  ):
                      raise SystemExit(f"Unsafe output value for {name}")
                  handle.write(f"{name}={value}\n")
          PY

      - name: Download pinned pipeline artifact
        if: steps.ecr_tag.outputs.exists == 'false'
        shell: bash
        env:
          BUCKET: ${{ steps.manifest.outputs.bucket }}
          FILENAME: ${{ steps.manifest.outputs.pipeline_filename }}
          S3_KEY: ${{ steps.manifest.outputs.pipeline_key }}
          VERSION_ID: ${{ steps.manifest.outputs.pipeline_version_id }}
        run: |
          set -euo pipefail

          if [[ "$FILENAME" != "delay_model_v2_pipeline.joblib" ]]; then
            echo "Unexpected pipeline filename." >&2
            exit 1
          fi

          if [[ -L models ]]; then
            echo "Refusing to use a symlinked models directory." >&2
            exit 1
          fi

          mkdir -p models
          target="models/$FILENAME"

          if [[ -e "$target" || -L "$target" ]]; then
            echo "Refusing to overwrite existing artifact: $target" >&2
            exit 1
          fi

          aws s3api get-object \
            --bucket "$BUCKET" \
            --key "$S3_KEY" \
            --version-id "$VERSION_ID" \
            --checksum-mode ENABLED \
            --region ap-southeast-1 \
            --output json \
            --no-cli-pager \
            "$target" > "$RUNNER_TEMP/pipeline-get-object.json"

      - name: Download pinned metrics artifact
        if: steps.ecr_tag.outputs.exists == 'false'
        shell: bash
        env:
          BUCKET: ${{ steps.manifest.outputs.bucket }}
          FILENAME: ${{ steps.manifest.outputs.metrics_filename }}
          S3_KEY: ${{ steps.manifest.outputs.metrics_key }}
          VERSION_ID: ${{ steps.manifest.outputs.metrics_version_id }}
        run: |
          set -euo pipefail

          if [[ "$FILENAME" != "delay_model_v2_metrics.json" ]]; then
            echo "Unexpected metrics filename." >&2
            exit 1
          fi

          if [[ -L models ]]; then
            echo "Refusing to use a symlinked models directory." >&2
            exit 1
          fi

          mkdir -p models
          target="models/$FILENAME"

          if [[ -e "$target" || -L "$target" ]]; then
            echo "Refusing to overwrite existing artifact: $target" >&2
            exit 1
          fi

          aws s3api get-object \
            --bucket "$BUCKET" \
            --key "$S3_KEY" \
            --version-id "$VERSION_ID" \
            --checksum-mode ENABLED \
            --region ap-southeast-1 \
            --output json \
            --no-cli-pager \
            "$target" > "$RUNNER_TEMP/metrics-get-object.json"

      - name: Verify downloaded artifacts without loading them
        if: steps.ecr_tag.outputs.exists == 'false'
        shell: bash
        env:
          PIPELINE_FILENAME: ${{ steps.manifest.outputs.pipeline_filename }}
          PIPELINE_SIZE: ${{ steps.manifest.outputs.pipeline_size }}
          PIPELINE_SHA256_HEX: ${{ steps.manifest.outputs.pipeline_sha256_hex }}
          PIPELINE_SHA256_BASE64: ${{ steps.manifest.outputs.pipeline_sha256_base64 }}
          PIPELINE_VERSION_ID: ${{ steps.manifest.outputs.pipeline_version_id }}
          METRICS_FILENAME: ${{ steps.manifest.outputs.metrics_filename }}
          METRICS_SIZE: ${{ steps.manifest.outputs.metrics_size }}
          METRICS_SHA256_HEX: ${{ steps.manifest.outputs.metrics_sha256_hex }}
          METRICS_SHA256_BASE64: ${{ steps.manifest.outputs.metrics_sha256_base64 }}
          METRICS_VERSION_ID: ${{ steps.manifest.outputs.metrics_version_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path

          def require(condition, message):
              if not condition:
                  raise SystemExit(f"Artifact verification failed: {message}")

          def file_sha256(path):
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.digest()

          artifacts = (
              {
                  "label": "pipeline",
                  "filename": os.environ["PIPELINE_FILENAME"],
                  "required_filename": "delay_model_v2_pipeline.joblib",
                  "size": int(os.environ["PIPELINE_SIZE"]),
                  "sha256_hex": os.environ["PIPELINE_SHA256_HEX"],
                  "sha256_base64": os.environ["PIPELINE_SHA256_BASE64"],
                  "version_id": os.environ["PIPELINE_VERSION_ID"],
                  "response_path": Path(
                      os.environ["RUNNER_TEMP"]
                  ) / "pipeline-get-object.json",
              },
              {
                  "label": "metrics",
                  "filename": os.environ["METRICS_FILENAME"],
                  "required_filename": "delay_model_v2_metrics.json",
                  "size": int(os.environ["METRICS_SIZE"]),
                  "sha256_hex": os.environ["METRICS_SHA256_HEX"],
                  "sha256_base64": os.environ["METRICS_SHA256_BASE64"],
                  "version_id": os.environ["METRICS_VERSION_ID"],
                  "response_path": Path(
                      os.environ["RUNNER_TEMP"]
                  ) / "metrics-get-object.json",
              },
          )

          for artifact in artifacts:
              filename = artifact["filename"]
              require(
                  filename == artifact["required_filename"],
                  f"unexpected local filename for {artifact['label']}",
              )

              path = Path("models") / filename
              require(
                  path.parent == Path("models"),
                  f"unexpected local path for {artifact['label']}",
              )
              require(not path.is_symlink(), f"{artifact['label']} is a symlink")
              require(path.is_file(), f"{artifact['label']} file is missing")
              require(
                  path.stat().st_size == artifact["size"],
                  f"local byte size differs for {artifact['label']}",
              )

              digest_bytes = file_sha256(path)
              local_hex = digest_bytes.hex()
              local_base64 = base64.b64encode(digest_bytes).decode("ascii")

              require(
                  local_hex == artifact["sha256_hex"],
                  f"local SHA-256 hex differs for {artifact['label']}",
              )
              require(
                  local_base64 == artifact["sha256_base64"],
                  f"local SHA-256 base64 differs for {artifact['label']}",
              )

              require(
                  artifact["response_path"].is_file(),
                  f"S3 response metadata is missing for {artifact['label']}",
              )
              with artifact["response_path"].open(
                  "r",
                  encoding="utf-8",
              ) as handle:
                  response = json.load(handle)

              require(
                  type(response.get("ContentLength")) is int
                  and response["ContentLength"] == artifact["size"],
                  f"S3 ContentLength differs for {artifact['label']}",
              )
              require(
                  response.get("ChecksumSHA256")
                  == artifact["sha256_base64"],
                  f"S3 ChecksumSHA256 differs for {artifact['label']}",
              )
              require(
                  response.get("VersionId") == artifact["version_id"],
                  f"S3 VersionId differs for {artifact['label']}",
              )
              require(
                  response.get("ServerSideEncryption") == "AES256",
                  f"S3 encryption differs for {artifact['label']}",
              )

              print(
                  f"Verified {filename}: size, local SHA-256, "
                  "S3 checksum, version ID, and AES256."
              )
          PY

      - name: Log in to Amazon ECR
        if: steps.ecr_tag.outputs.exists == 'false'
        shell: bash
        run: |
          set -euo pipefail
          aws ecr get-login-password \
            --region ap-southeast-1 \
            --no-cli-pager |
            docker login \
              --username AWS \
              --password-stdin \
              "$ECR_REGISTRY"

      - name: Build, smoke-test, and push immutable image once
        if: steps.ecr_tag.outputs.exists == 'false'
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.ecr_tag.outputs.tag }}
        run: |
          set -euo pipefail
          image_uri="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          smoke_container="delivery-delay-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          cleanup_smoke_container() {
            docker rm --force "$smoke_container" >/dev/null 2>&1 || true
          }

          print_smoke_failure() {
            echo "$1" >&2
            echo "===== temporary container logs =====" >&2
            docker logs "$smoke_container" >&2 || true
          }

          trap cleanup_smoke_container EXIT

          docker build \
            --tag "$image_uri" \
            .

          if ! docker run \
            --detach \
            --name "$smoke_container" \
            "$image_uri" >/dev/null; then
            print_smoke_failure "Unable to start the temporary container."
            exit 1
          fi

          smoke_passed=false
          for attempt in $(seq 1 60); do
            if ! container_state=$(docker inspect --format '{{.State.Status}}' "$smoke_container"); then
              print_smoke_failure "Unable to inspect the temporary container."
              exit 1
            fi

            if [[ "$container_state" == "exited" || "$container_state" == "dead" ]]; then
              print_smoke_failure "Temporary container entered state: $container_state"
              exit 1
            fi

            if [[ "$container_state" != "running" ]]; then
              print_smoke_failure "Unexpected temporary container state: $container_state"
              exit 1
            fi

            if ! health_status=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' "$smoke_container"); then
              print_smoke_failure "Unable to inspect the temporary container health status."
              exit 1
            fi

            case "$health_status" in
              healthy)
                smoke_passed=true
                echo "Temporary container reached healthy status."
                break
                ;;
              unhealthy)
                print_smoke_failure "Temporary container became unhealthy."
                exit 1
                ;;
              starting)
                echo "Health poll $attempt/60: starting"
                ;;
              *)
                print_smoke_failure "Unexpected health status: $health_status"
                exit 1
                ;;
            esac

            sleep 3
          done

          if [[ "$smoke_passed" != "true" ]]; then
            print_smoke_failure "Timed out waiting for the temporary container to become healthy."
            exit 1
          fi

          docker push "$image_uri"

      - name: Verify final ECR digest
        id: final_image
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.ecr_tag.outputs.tag }}
          PREEXISTING_DIGEST: ${{ steps.ecr_tag.outputs.digest }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys

          tag = os.environ["IMAGE_TAG"]
          if re.fullmatch(r"sha-[0-9a-f]{40}", tag) is None:
              raise SystemExit("Malformed immutable image tag")

          command = [
              "aws",
              "ecr",
              "describe-images",
              "--registry-id",
              "556071985875",
              "--repository-name",
              "delivery-delay-app",
              "--image-ids",
              f"imageTag={tag}",
              "--region",
              "ap-southeast-1",
              "--no-cli-pager",
              "--output",
              "json",
          ]
          result = subprocess.run(
              command,
              check=False,
              capture_output=True,
              text=True,
          )
          if result.returncode != 0:
              sys.stderr.write(result.stderr)
              raise SystemExit(
                  f"Final ECR verification failed with exit code "
                  f"{result.returncode}"
              )

          try:
              response = json.loads(result.stdout)
          except json.JSONDecodeError as exc:
              raise SystemExit(
                  "Final ECR verification returned invalid JSON"
              ) from exc

          details = response.get("imageDetails")
          if not isinstance(details, list) or len(details) != 1:
              raise SystemExit(
                  "Final ECR verification did not return exactly one image"
              )

          detail = details[0]
          digest = detail.get("imageDigest")
          tags = detail.get("imageTags")

          if (
              not isinstance(digest, str)
              or re.fullmatch(r"sha256:[0-9a-f]{64}", digest) is None
          ):
              raise SystemExit("Final ECR digest is malformed")
          if not isinstance(tags, list) or tag not in tags:
              raise SystemExit("Final ECR result does not contain the requested tag")

          preexisting_digest = os.environ.get("PREEXISTING_DIGEST", "")
          if preexisting_digest and digest != preexisting_digest:
              raise SystemExit(
                  "Existing ECR tag changed digest during this workflow"
              )

          github_output = os.environ.get("GITHUB_OUTPUT")
          if not github_output:
              raise SystemExit("GITHUB_OUTPUT is unavailable")
          if "\n" in digest or "\r" in digest or "\x00" in digest:
              raise SystemExit("Unsafe ECR digest output")

          with open(github_output, "a", encoding="utf-8", newline="\n") as handle:
              handle.write(f"digest={digest}\n")

          print(f"Verified ECR tag {tag} at digest {digest}.")
          PY

      - name: Wait for and report image scan status
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.final_image.outputs.digest }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys
          import time

          digest = os.environ["IMAGE_DIGEST"]
          if re.fullmatch(r"sha256:[0-9a-f]{64}", digest) is None:
              raise SystemExit("Malformed image digest for scan verification")

          command = [
              "aws",
              "ecr",
              "describe-image-scan-findings",
              "--registry-id",
              "556071985875",
              "--repository-name",
              "delivery-delay-app",
              "--image-id",
              f"imageDigest={digest}",
              "--region",
              "ap-southeast-1",
              "--no-cli-pager",
              "--no-paginate",
              "--query",
              (
                  "{Status:imageScanStatus.status,"
                  "Description:imageScanStatus.description,"
                  "SeverityCounts:imageScanFindings.findingSeverityCounts}"
              ),
              "--output",
              "json",
          ]

          pending_statuses = {"IN_PROGRESS", "PENDING"}
          terminal_failure_statuses = {
              "FAILED",
              "UNSUPPORTED_IMAGE",
              "SCAN_ELIGIBILITY_EXPIRED",
              "FINDINGS_UNAVAILABLE",
              "LIMIT_EXCEEDED",
              "IMAGE_ARCHIVED",
          }

          for attempt in range(31):
              result = subprocess.run(
                  command,
                  check=False,
                  capture_output=True,
                  text=True,
              )

              if result.returncode != 0:
                  if (
                      "ScanNotFoundException" in result.stderr
                      and attempt < 30
                  ):
                      time.sleep(10)
                      continue

                  sys.stderr.write(result.stderr)
                  raise SystemExit(
                      "Unable to retrieve ECR image scan status"
                  )

              try:
                  response = json.loads(result.stdout)
              except json.JSONDecodeError as exc:
                  raise SystemExit(
                      "ECR scan response was not valid JSON"
                  ) from exc

              status = response.get("Status")
              description = response.get("Description")
              counts = response.get("SeverityCounts") or {}

              if status == "COMPLETE":
                  print(
                      "ECR basic scan completed. Severity counts are "
                      f"reported without enforcing a severity gate: "
                      f"{json.dumps(counts, sort_keys=True)}"
                  )
                  break

              if status == "ACTIVE":
                  print(
                      "ECR enhanced scanning is ACTIVE. Findings are "
                      "reported without enforcing a severity gate: "
                      f"{json.dumps(counts, sort_keys=True)}"
                  )
                  break

              if status in terminal_failure_statuses:
                  raise SystemExit(
                      f"ECR scan ended with status {status}: {description}"
                  )

              if status not in pending_statuses:
                  raise SystemExit(
                      f"Unexpected ECR scan status {status!r}: {description}"
                  )

              if attempt == 30:
                  raise SystemExit(
                      f"ECR scan did not reach COMPLETE or ACTIVE: {status}"
                  )

              time.sleep(10)
          PY

      - name: Remove Docker registry credentials
        if: always() && steps.ecr_tag.outputs.exists == 'false'
        shell: bash
        run: |
          docker logout "$ECR_REGISTRY" >/dev/null 2>&1 || true
